<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NioHub</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:430px;min-height:100vh;font-family:sans-serif;background:#FBF7EE;color:#1E1A14}
header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;color:#0E6B47;font-size:26px}
.plus{width:44px;height:44px;border:0;border-radius:12px;background:#0E6B47;color:#fff;font-size:24px}
.search{margin:0 20px;padding:12px 14px;border:1px solid #E6DECB;border-radius:12px;background:#fff;color:#6B6254}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 20px}
.cat{height:64px;border-radius:14px;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 20px 90px}
.card{background:#fff;border:1px solid #EDE5D3;border-radius:14px;overflow:hidden;cursor:pointer}
.img{height:120px}
.info{padding:10px}
.name{font-size:14px;font-weight:bold}
.price{color:#0E6B47;font-weight:bold;margin-top:4px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;background:#fff;border-top:1px solid #E6DECB}
nav button{flex:1;height:60px;border:0;background:none;color:#6B6254;font-size:12px}
nav button.on{color:#0E6B47;font-weight:bold}
.fiche{display:none;padding:0 0 100px}
.fiche .photo{height:280px}
.fiche .corps{padding:18px 20px}
.fiche .prix{color:#0E6B47;font-size:22px;font-weight:bold}
.fiche .titre{font-size:18px;font-weight:bold;margin-top:4px}
.fiche .desc{font-size:14px;color:#6B6254;line-height:1.5;margin-top:10px}
.boutique{background:#fff;border:1px solid #EDE5D3;border-radius:14px;padding:12px;margin-top:16px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 20px;background:#fff;border-top:1px solid #E6DECB}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:#0E6B47;color:#fff;font-size:15px;font-weight:bold}
.secondaire{width:100%;height:52px;border-radius:12px;background:#fff;color:#0E6B47;border:1.5px solid #0E6B47;font-size:15px;font-weight:bold;margin-top:10px}
.retour{border:0;background:none;font-size:24px;padding:0 4px}
.ajout{display:none;padding:0 20px 40px}
.ajout header{padding:16px 0}
.ajout label{display:block;font-size:13px;font-weight:bold;margin:14px 0 6px}
.ajout input,.ajout textarea{width:100%;padding:12px;border:1px solid #E6DECB;border-radius:12px;background:#fff;font-size:15px;font-family:sans-serif}
.ajout textarea{height:90px}
.apercu{width:100%;height:200px;border-radius:14px;border:2px dashed #0E6B47;background:#fff;display:flex;align-items:center;justify-content:center;color:#0E6B47;font-weight:bold;margin-top:6px}
.msg{color:#B4291A;font-size:14px;margin-top:12px;min-height:20px}
.nomboutique{font-size:20px;font-weight:bold;color:#0E6B47}
.liste{background:#fff;border:1px solid #EDE5D3;border-radius:14px;padding:6px 14px;font-size:14px;color:#6B6254;margin-bottom:12px}
.ligne{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #EDE5D3;color:#1E1A14}
.ligne:last-child{border-bottom:0}
.vignette{width:56px;height:56px;border-radius:12px;flex-shrink:0;background:#D9B26F}
</style>
</head>
<body>

<div id="accueil">
<header><h1>NioHub</h1><button class="plus" onclick="voirAjout()">+</button></header>
<div class="search">Rechercher un produit</div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<nav>
<button class="on">Accueil</button>
<button onclick="voirBoutique()">Boutique</button>
<button onclick="alert('Bientôt disponible')">Profil</button>
</nav>
</div>

<div id="fiche" class="fiche">
<header><button class="retour" onclick="voirAccueil()">←</button><span style="font-weight:bold">Produit</span><span></span></header>
<div class="photo" id="fphoto"></div>
<div class="corps">
<div class="prix" id="fprix"></div>
<div class="titre" id="fnom"></div>
<div class="desc" id="fdesc"></div>
<div class="boutique"><b>Boutique Aminata</b><br><span style="font-size:12px;color:#6B6254">Dakar, Médina · Vérifiée</span></div>
</div>
<div class="bar"><button class="btn" onclick="alert('Bientôt disponible')">Commander</button></div>
</div>

<div id="connexion" class="ajout">
<header><button class="retour" onclick="voirAccueil()">←</button><span style="font-weight:bold">Connexion</span><span></span></header>
<label>E-mail</label>
<input id="email" type="email" placeholder="vous@exemple.com">
<label>Mot de passe (6 caractères minimum)</label>
<input id="mdp" type="password" placeholder="Votre mot de passe">
<button class="btn" style="margin-top:20px" onclick="authentifier('connexion')">Se connecter</button>
<button class="secondaire" onclick="authentifier('inscription')">Créer un compte</button>
<div id="msg" class="msg"></div>
</div>

<div id="ajout" class="ajout">
<header><button class="retour" onclick="voirAccueil()">←</button><span style="font-weight:bold">Ajouter un produit</span><span></span></header>
<div class="apercu" id="apercu" onclick="document.getElementById('photo').click()">+ Choisir une photo</div>
<input type="file" id="photo" accept="image/*" style="display:none" onchange="choisirPhoto(event)">
<label>Nom du produit</label>
<input id="nom" placeholder="Ex. Boubou brodé">
<label>Prix (FCFA)</label>
<input id="prix" type="number" inputmode="numeric" placeholder="Ex. 25000">
<label>Description</label>
<textarea id="desc" placeholder="Décrivez le produit"></textarea>
<button class="btn" style="margin-top:20px" onclick="publier()">Publier</button>
<button class="secondaire" onclick="deconnexion()">Se déconnecter</button>
</div>

<div id="boutique" class="ajout" style="padding-bottom:110px">
<header><span style="font-weight:bold;font-size:20px">Ma boutique</span><span></span></header>
<div class="boutique" style="margin-top:0">
<div class="nomboutique">Boutique de test</div>
<div style="font-size:13px;color:#6B6254;margin-top:4px">Dakar, Médina</div>
</div>
<button class="btn" style="margin-top:14px" onclick="voirAjout()">+ Ajouter un produit</button>
<label>Mes produits</label>
<div id="bmes" class="liste">Chargement…</div>
<label>Commandes</label>
<div class="liste">Aucune commande pour l'instant.</div>
<nav>
<button onclick="voirAccueil()">Accueil</button>
<button class="on">Boutique</button>
<button onclick="alert('Bientôt disponible')">Profil</button>
</nav>
</div>

<script>
const SUPABASE_URL="https://zpmjbggzqwcajjrzfejg.supabase.co";
const SUPABASE_KEY="sb_publishable_dz22DUOnanzHiA2jLk305g_Cf6KCVPr";

const cats=[["Mode","#F2D9A3"],["Tech","#BFD8E3"],["Maison","#E3C4B3"],["Beauté","#C8DDBE"]];
document.getElementById('cats').innerHTML=cats.map(([n,c])=>`<div class="cat" style="background:${c}">${n}</div>`).join('');

const defauts=[
{nom:"Boubou brodé",prix:"25 000 FCFA",couleur:"#D9B26F",desc:"Bazin riche, broderie faite main. Tailles M à XXL."},
{nom:"Sac en cuir",prix:"18 000 FCFA",couleur:"#C98B6B",desc:"Sac en cuir véritable, fait à la main."},
{nom:"Écouteurs",prix:"12 500 FCFA",couleur:"#8FB7C9",desc:"Écouteurs sans fil avec boîtier de charge."},
{nom:"Huile de baobab",prix:"4 500 FCFA",couleur:"#A8C59A",desc:"Huile de baobab naturelle, 100 ml."}
];
let distants=[];
let photoChoisie="";

function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function session(){try{return JSON.parse(localStorage.getItem('niohub_session')||'null');}catch(e){return null;}}
function sauverSession(s){localStorage.setItem('niohub_session',JSON.stringify(s));}
function effacerSession(){localStorage.removeItem('niohub_session');}

function tous(){return defauts.concat(distants);}
function fond(p){return p.photo?`url(${p.photo}) center/cover no-repeat`:p.couleur;}

async function chargerProduits(){
try{
const r=await fetch(SUPABASE_URL+"/rest/v1/produits?select=*&order=created_at.desc",{headers:{apikey:SUPABASE_KEY}});
if(!r.ok) throw new Error(r.status);
const lignes=await r.json();
distants=lignes.map(l=>({nom:l.nom,prix:l.prix,desc:l.description||'Pas de description.',photo:l.photo||"",couleur:'#D9B26F'}));
}catch(e){
console.log(e);
}
afficherGrille();
}

function afficherGrille(){
document.getElementById('grid').innerHTML=tous().map((p,i)=>`<div class="card" onclick="ouvrir(${i})"><div class="img" style="background:${fond(p)}"></div><div class="info"><div class="name">${esc(p.nom)}</div><div class="price">${esc(p.prix)}</div></div></div>`).join('');
}
function ouvrir(i){
const p=tous()[i];
document.getElementById('fphoto').style.background=fond(p);
document.getElementById('fprix').textContent=p.prix;
document.getElementById('fnom').textContent=p.nom;
document.getElementById('fdesc').textContent=p.desc;
montrer('fiche');
}
function montrer(vue){
['accueil','fiche','ajout','connexion','boutique'].forEach(v=>document.getElementById(v).style.display=v===vue?'block':'none');
window.scrollTo(0,0);
}
function voirAccueil(){montrer('accueil');}

function voirAjout(){
if(!session()){document.getElementById('msg').textContent='';montrer('connexion');return;}
photoChoisie="";
['nom','prix','desc'].forEach(id=>document.getElementById(id).value="");
const ap=document.getElementById('apercu');
ap.style.background="#fff";
ap.textContent="+ Choisir une photo";
montrer('ajout');
}

async function voirBoutique(){
const s=session();
if(!s){document.getElementById('msg').textContent='';montrer('connexion');return;}
montrer('boutique');
const zone=document.getElementById('bmes');
zone.textContent='Chargement…';
try{
const u=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+s.token}});
if(!u.ok){effacerSession();alert('Reconnectez-vous.');montrer('connexion');return;}
const user=await u.json();
const r=await fetch(SUPABASE_URL+'/rest/v1/produits?select=*&user_id=eq.'+user.id+'&order=created_at.desc',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+s.token}});
if(!r.ok) throw new Error(r.status);
const lignes=await r.json();
zone.innerHTML=lignes.length
?lignes.map(l=>`<div class="ligne"><div class="vignette" style="background:${l.photo?'url('+l.photo+') center/cover':'#D9B26F'}"></div><div><div class="name">${esc(l.nom)}</div><div class="price">${esc(l.prix)}</div></div></div>`).join('')
:'Vous n\'avez pas encore de produit.';
}catch(e){
zone.textContent='Erreur de chargement.';
}
}

async function authentifier(type){
const email=document.getElementById('email').value.trim();
const mdp=document.getElementById('mdp').value;
const msg=document.getElementById('msg');
msg.textContent='';
if(!email||mdp.length<6){msg.textContent='Entrez un e-mail et un mot de passe de 6 caractères minimum.';return;}
const url=type==='inscription'?SUPABASE_URL+'/auth/v1/signup':SUPABASE_URL+'/auth/v1/token?grant_type=password';
try{
const r=await fetch(url,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:mdp})});
const j=await r.json();
if(!r.ok){msg.textContent=j.msg||j.error_description||'Erreur, réessayez.';return;}
if(j.access_token){
sauverSession({token:j.access_token,email:email});
voirAjout();
}else{
msg.textContent='Compte créé. Ouvrez le lien reçu par e-mail, puis connectez-vous.';
}
}catch(e){msg.textContent='Erreur réseau, réessayez.';}
}

function deconnexion(){
effacerSession();
alert('Vous êtes déconnecté.');
voirAccueil();
}

function choisirPhoto(e){
const f=e.target.files[0];
if(!f)return;
const lecteur=new FileReader();
lecteur.onload=()=>{
const img=new Image();
img.onload=()=>{
const echelle=Math.min(1,600/img.width);
const c=document.createElement('canvas');
c.width=img.width*echelle;
c.height=img.height*echelle;
c.getContext('2d').drawImage(img,0,0,c.width,c.height);
photoChoisie=c.toDataURL('image/jpeg',0.7);
const ap=document.getElementById('apercu');
ap.textContent="";
ap.style.background=`url(${photoChoisie}) center/cover no-repeat`;
};
img.src=lecteur.result;
};
lecteur.readAsDataURL(f);
}

async function publier(){
const s=session();
if(!s){montrer('connexion');return;}
const nom=document.getElementById('nom').value.trim();
const prix=document.getElementById('prix').value.trim();
const desc=document.getElementById('desc').value.trim();
if(!nom||!prix){alert('Indiquez au moins le nom et le prix.');return;}
const corps={nom:nom,prix:Number(prix).toLocaleString('fr-FR')+' FCFA',description:desc||null,photo:photoChoisie||null};
try{
const r=await fetch(SUPABASE_URL+"/rest/v1/produits",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+s.token,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(corps)});
if(r.status===401||r.status===403){effacerSession();alert('Reconnectez-vous.');montrer('connexion');return;}
if(!r.ok) throw new Error(r.status);
}catch(e){
alert('Erreur, produit non enregistré. Réessayez.');
return;
}
await chargerProduits();
voirAccueil();
}

chargerProduits();
</script>
</body>
</html>
